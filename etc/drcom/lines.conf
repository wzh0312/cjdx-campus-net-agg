# ============================================================
#  多线路定义表  /etc/drcom/lines.conf
#  列: 线路名  接口名  类型     MAC                  路由表  规则优先级  凭据文件
#  ------------------------------------------------------------
#  type=netifd  : 由 OpenWrt netifd 管理的既有接口（账号A，生产配置，本脚本只读不改）
#  type=macvlan : 本脚本自管的 macvlan 逻辑客户端（父接口 = wan）
#  type=physical: 本脚本自管的【物理口】线路（如 lan2），不创建任何虚拟接口，
#                 只设置 MAC + 拉起 udhcpc。用于第二条物理上行。
#  type=sta     : 本脚本自管的【无线 STA】线路（如 apclix0，校园 WiFi）。
#                 关联由 /etc/init.d/drcom-wifi-line 建立；本类型只确认接口存在 +
#                 拉 udhcpc，不改 MAC、不建虚拟接口。
#  table=0      : 不做策略路由，使用主表（仅账号A）
#  table>0      : 该线路走独立路由表 table，并安装 ip rule pref 做源策略
#  ------------------------------------------------------------
#  MAC 写 '-' 表示不改动接口原有 MAC（仅 netifd 类型这样做）
#  注意: 用空格分隔，不要用制表符
# ============================================================
#name ifname type     mac                table pref cred
A      wan    netifd   -                  0     0    cred-a.conf
B      wanb   macvlan  02:00:00:00:00:0B  100   100  cred-b.conf
C      wanc   macvlan  02:00:00:00:00:0C  101   101  cred-c.conf
D      apclix0 sta      -                  102   102  cred-d.conf
